<!DOCTYPE html>
<html>
<head>
    <title>FitBro - Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .phone-frame {
            width: 400px;
            background: white;
            border-radius: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            height: 750px;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: linear-gradient(135deg, #48c774, #3ab566);
            padding: 30px 25px;
            color: white;
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-side {
            width: 42px;
            display: flex;
            align-items: center;
        }

        .header-side.right { justify-content: flex-end; }

        .date-section {
            flex: 1;
            text-align: center;
        }

        .date-section h1 { font-size: 22px; font-weight: 600; }

        .header-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .header-btn:hover { background: rgba(255,255,255,0.35); }

        .content {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
            background: white;
        }

        .calorie-circle-container {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }

        .calorie-circle {
            position: relative;
            width: 180px;
            height: 180px;
        }

        .calorie-circle svg { transform: rotate(-90deg); }
        .calorie-circle circle { fill: none; stroke-width: 12; }

        .circle-bg       { stroke: #e8e8e8; }
        .circle-progress { stroke: #48c774; stroke-linecap: round; transition: stroke-dashoffset 0.5s ease; }

        .calorie-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .calorie-number { font-size: 48px; font-weight: 700; color: #2c3e50; line-height: 1; }
        .calorie-label  { font-size: 14px; color: #7f8c8d; margin-top: 5px; }

        .macros { display: flex; gap: 12px; margin-bottom: 30px; }

        .macro-card {
            flex: 1;
            padding: 15px;
            border-radius: 15px;
            text-align: center;
        }

        .macro-card.protein { background: #e3f2fd; }
        .macro-card.carbs   { background: #fff3e0; }
        .macro-card.fats    { background: #f3e5f5; }

        .macro-label { font-size: 12px; color: #7f8c8d; margin-bottom: 5px; }
        .macro-value { font-size: 24px; font-weight: 700; }

        .macro-card.protein .macro-value { color: #1976d2; }
        .macro-card.carbs   .macro-value { color: #f57c00; }
        .macro-card.fats    .macro-value { color: #7b1fa2; }

        .meals-section { margin-bottom: 20px; }

        .meal-card {
            background: linear-gradient(135deg, #48c774, #3ab566);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 12px;
            transition: transform 0.2s;
        }

        .meal-card:hover { transform: translateY(-2px); }

        .meal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            cursor: pointer;
            user-select: none;
        }

        .meal-header-left h3 { font-size: 18px; font-weight: 600; }

        .meal-header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .meal-calories { font-size: 22px; font-weight: 700; color: white; }

        .meal-chevron {
            font-size: 14px;
            color: rgba(255,255,255,0.8);
            transition: transform 0.2s;
            display: inline-block;
        }

        .meal-items {
            margin-top: 4px;
            color: rgba(255,255,255,0.75);
            font-size: 12px;
        }

        .meal-body {
            display: none;
            margin-top: 12px;
            border-top: 1px solid rgba(255,255,255,0.25);
            padding-top: 10px;
        }

        .food-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 9px 10px;
            border-radius: 10px;
            background: rgba(255,255,255,0.18);
            margin-bottom: 6px;
            transition: background 0.15s;
        }

        .food-item:last-child { margin-bottom: 0; }

        .food-item:hover { background: rgba(255,255,255,0.28); }

        .food-item-name {
            font-size: 14px;
            font-weight: 700;
            color: white;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

        .food-item-cal {
            font-size: 12px;
            font-weight: 600;
            color: rgba(255,255,255,0.9);
            margin-top: 3px;
        }

        .remove-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s;
            flex-shrink: 0;
            line-height: 1;
        }

        .remove-btn:hover { background: rgba(220,50,50,0.5); }

        .meal-empty-text {
            font-size: 12px;
            color: rgba(255,255,255,0.6);
            text-align: center;
            padding: 6px 0;
        }

        .bottom-nav {
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            background: linear-gradient(135deg, #2d6a4f, #1b4332);
            flex-shrink: 0;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            background: none;
            border: none;
            color: rgba(255,255,255,0.4);
            font-size: 10px;
            cursor: pointer;
            padding: 4px 10px;
            transition: color 0.2s;
        }

        .nav-item i { font-size: 18px; }
        .nav-item.active { color: white; }

        /* Dark mode */
        .phone-frame.dark { background: #1a1a2a; }
        .phone-frame.dark .content { background: #12121e; }
        .phone-frame.dark .macro-card.protein { background: #1a2535; }
        .phone-frame.dark .macro-card.carbs   { background: #261f14; }
        .phone-frame.dark .macro-card.fats    { background: #201424; }
        .phone-frame.dark .calorie-number { color: #e8e8f0; }
        .phone-frame.dark .calorie-label  { color: #6b6b80; }
        .phone-frame.dark .macro-label    { color: #6b6b80; }
    </style>
</head>
<body>
    <div class="phone-frame" id="phone-frame">
        <div class="header">
            <div class="header-side">
                <button class="header-btn" onclick="navigate('/settings')">
                    <i class="fas fa-gear"></i>
                </button>
            </div>
            <div class="date-section">
                <h1 id="current-date"></h1>
            </div>
            <div class="header-side right">
                <button class="header-btn" onclick="navigate('/profile')">
                    <i class="fas fa-user"></i>
                </button>
            </div>
        </div>

        <div class="content">
            <div class="calorie-circle-container">
                <div class="calorie-circle">
                    <svg width="180" height="180">
                        <circle class="circle-bg" cx="90" cy="90" r="80"></circle>
                        <circle class="circle-progress" cx="90" cy="90" r="80"
                                id="progress-circle"
                                stroke-dasharray="502.4"
                                stroke-dashoffset="502.4"></circle>
                    </svg>
                    <div class="calorie-text">
                        <div class="calorie-number" id="calories-remaining">—</div>
                        <div class="calorie-label">remaining</div>
                    </div>
                </div>
            </div>

            <div class="macros">
                <div class="macro-card protein">
                    <div class="macro-label">Protein</div>
                    <div class="macro-value" id="protein-value">0g</div>
                </div>
                <div class="macro-card carbs">
                    <div class="macro-label">Carbs</div>
                    <div class="macro-value" id="carbs-value">0g</div>
                </div>
                <div class="macro-card fats">
                    <div class="macro-label">Fats</div>
                    <div class="macro-value" id="fats-value">0g</div>
                </div>
            </div>

            <div class="meals-section" id="meals-section"></div>
        </div>

        <div class="bottom-nav">
            <button class="nav-item active" onclick="navigate('/')"><i class="fas fa-house"></i><span>Home</span></button>
            <button class="nav-item" onclick="navigate('/add-food')"><i class="fas fa-plus"></i><span>Add</span></button>
            <button class="nav-item" onclick="navigate('/stats')"><i class="fas fa-calendar-days"></i><span>Diary</span></button>
            <button class="nav-item" onclick="navigate('/community')"><i class="fas fa-robot"></i><span>NutriBot</span></button>
            <button class="nav-item" onclick="navigate('/workout')"><i class="fas fa-dumbbell"></i><span>Workout</span></button>
        </div>
    </div>

    <script>
        if (localStorage.getItem('fitbro_darkMode') === 'true') {
            document.getElementById('phone-frame').classList.add('dark');
        }

        const days   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
        const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        const today  = new Date();
        document.getElementById('current-date').textContent =
            `${days[today.getDay()]}, ${months[today.getMonth()]} ${today.getDate()}`;

        function navigate(path) { window.location.href = path; }

        const expandedMeals = new Set();

        let calorieGoal = 2000;

        function loadFoodLog() {
            Promise.all([
                fetch('/api/food-log').then(r => r.json()),
                fetch('/api/user').then(r => r.json())
            ])
                .then(([foodData, userData]) => {
                    calorieGoal = userData.daily_calorie_goal || 2000;
                    displayMealCards(foodData);
                    calculateTotals(foodData);
                })
                .catch(() => displayMealCards([]));
        }

        loadFoodLog();

        function displayMealCards(foods) {
            const section   = document.getElementById('meals-section');
            const mealTypes = ['Breakfast', 'Lunch', 'Dinner', 'Snack'];
            const groups    = {};
            mealTypes.forEach(t => { groups[t] = foods.filter(f => f.meal_type === t); });

            section.innerHTML = mealTypes.map(mealType => {
                const items    = groups[mealType];
                const totalCal = Math.round(items.reduce((sum, f) => sum + (f.calories * f.servings), 0));
                const count    = items.length;
                const isOpen   = expandedMeals.has(mealType);

                const itemsHtml = items.length > 0
                    ? items.map(f => `
                        <div class="food-item" id="food-item-${f.log_id}">
                            <div>
                                <div class="food-item-name">${f.name}</div>
                                <div class="food-item-cal">${Math.round(f.calories * f.servings)} cal &middot; ${f.servings}x serving</div>
                            </div>
                            <button class="remove-btn" onclick="deleteFood(${f.log_id}, event)" title="Remove">&#215;</button>
                        </div>`).join('')
                    : '<div class="meal-empty-text">No items yet</div>';

                return `
                    <div class="meal-card">
                        <div class="meal-header" onclick="toggleMeal('${mealType}')">
                            <div class="meal-header-left">
                                <h3>${mealType}</h3>
                                <div class="meal-items">${count > 0 ? `${count} item${count !== 1 ? 's' : ''}` : 'No items yet'}</div>
                            </div>
                            <div class="meal-header-right">
                                <div class="meal-calories">${totalCal} cal</div>
                                <span class="meal-chevron" id="chevron-${mealType}" style="transform:${isOpen ? 'rotate(180deg)' : 'rotate(0deg)'}">&#9660;</span>
                            </div>
                        </div>
                        <div class="meal-body" id="meal-body-${mealType}" style="display:${isOpen ? 'block' : 'none'}">
                            ${itemsHtml}
                        </div>
                    </div>`;
            }).join('');
        }

        function toggleMeal(mealType) {
            const body    = document.getElementById(`meal-body-${mealType}`);
            const chevron = document.getElementById(`chevron-${mealType}`);
            if (expandedMeals.has(mealType)) {
                expandedMeals.delete(mealType);
                body.style.display    = 'none';
                chevron.style.transform = 'rotate(0deg)';
            } else {
                expandedMeals.add(mealType);
                body.style.display    = 'block';
                chevron.style.transform = 'rotate(180deg)';
            }
        }

        async function deleteFood(logId, event) {
            event.stopPropagation();
            try {
                const res = await fetch(`/api/delete-food/${logId}`, { method: 'DELETE' });
                if (res.ok) { loadFoodLog(); }
            } catch(e) {}
        }

        function calculateTotals(meals) {
            const goal = calorieGoal;
            let consumed = 0, protein = 0, carbs = 0, fat = 0;

            meals.forEach(m => {
                consumed += m.calories * m.servings;
                protein  += m.protein  * m.servings;
                carbs    += m.carbs    * m.servings;
                fat      += m.fat      * m.servings;
            });

            document.getElementById('calories-remaining').textContent = Math.round(goal - consumed);
            document.getElementById('protein-value').textContent = Math.round(protein) + 'g';
            document.getElementById('carbs-value').textContent   = Math.round(carbs)   + 'g';
            document.getElementById('fats-value').textContent    = Math.round(fat)     + 'g';

            const circ = 502.4;
            document.getElementById('progress-circle').style.strokeDashoffset =
                circ - ((consumed / goal) * circ);
        }
    </script>
</body>
</html>
