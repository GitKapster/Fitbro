<!DOCTYPE html>
<html>
<head>
    <title>FitBro - Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .phone-frame {
            width: 400px;
            background: white;
            border-radius: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            height: 750px;
            display: flex;
            flex-direction: column;
        }

        /* green header */
        .header {
            background: linear-gradient(135deg, #48c774, #3ab566);
            padding: 30px 25px 50px 25px;
            color: white;
            flex-shrink: 0;
            position: relative;
        }

        .header h1 { font-size: 28px; font-weight: 700; }

        /* user card sits half inside the header, half below */
        .user-card {
            background: white;
            border-radius: 24px;
            padding: 20px;
            margin: 0 15px;
            margin-top: -35px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.12);
            display: flex;
            align-items: center;
            gap: 16px;
            position: relative;
            z-index: 1;
        }

        .avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #48c774, #2d6a4f);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: 700;
            color: white;
            flex-shrink: 0;
        }

        .user-info { flex: 1; min-width: 0; }

        .user-name {
            font-size: 18px;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-email {
            font-size: 12px;
            color: #95a5a6;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .student-badge {
            display: inline-block;
            background: linear-gradient(135deg, #48c774, #3ab566);
            color: white;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            margin-top: 5px;
        }

        /* scrollable content below the user card */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background: #f5f5f5;
        }

        .section-card {
            background: white;
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .section-title {
            font-size: 13px;
            font-weight: 700;
            color: #95a5a6;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* edit / save toggle button */
        .edit-btn {
            background: #f0f9f4;
            border: none;
            color: #48c774;
            font-size: 13px;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .edit-btn:hover { background: #d4f5e0; }
        .edit-btn.saving { background: #48c774; color: white; }

        /* each goal row */
        .goal-row {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .goal-row:last-child { border-bottom: none; padding-bottom: 0; }
        .goal-row:first-child { padding-top: 0; }

        .goal-icon {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .goal-icon.cal  { background: #fff3e0; }
        .goal-icon.pro  { background: #e3f2fd; }
        .goal-icon.carb { background: #f3e5f5; }
        .goal-icon.fat  { background: #fffde7; }

        .goal-label {
            flex: 1;
            font-size: 14px;
            font-weight: 600;
            color: #2c3e50;
        }

        .goal-unit {
            font-size: 11px;
            color: #95a5a6;
            font-weight: 400;
            margin-left: 3px;
        }

        /* value shown in view mode */
        .goal-value {
            font-size: 20px;
            font-weight: 700;
        }

        .goal-value.cal  { color: #e67e22; }
        .goal-value.pro  { color: #3498db; }
        .goal-value.carb { color: #9b59b6; }
        .goal-value.fat  { color: #f39c12; }

        /* input shown in edit mode */
        .goal-input {
            display: none;
            width: 80px;
            padding: 8px 10px;
            border: 2px solid #48c774;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            text-align: right;
            outline: none;
            color: #2c3e50;
        }

        /* success toast */
        .toast {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: #2c3e50;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.3s;
            white-space: nowrap;
            pointer-events: none;
            z-index: 20;
        }

        .toast.show { opacity: 1; }

        /* logout button */
        .logout-btn {
            width: 100%;
            padding: 14px;
            background: none;
            border: 2px solid #ecf0f1;
            border-radius: 14px;
            color: #e74c3c;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .logout-btn:hover { background: #fff5f5; border-color: #e74c3c; }

        .bottom-nav {
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            background: linear-gradient(135deg, #2d6a4f, #1b4332);
            flex-shrink: 0;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            background: none;
            border: none;
            color: rgba(255,255,255,0.4);
            font-size: 10px;
            cursor: pointer;
            padding: 4px 10px;
            transition: color 0.2s;
        }

        .nav-item i { font-size: 18px; }
        .nav-item.active { color: white; }
    </style>
</head>
<body>
    <div class="phone-frame">

        <div class="header">
            <h1>Profile</h1>
        </div>

        <!-- user card overlaps the header -->
        <div class="user-card">
            <div class="avatar" id="avatar">?</div>
            <div class="user-info">
                <div class="user-name" id="user-name">Loading...</div>
                <div class="user-email" id="user-email"></div>
                <div id="student-badge" style="display:none">
                    <span class="student-badge">🎓 Student</span>
                </div>
            </div>
        </div>

        <div class="content">

            <!-- daily goals section -->
            <div class="section-card">
                <div class="section-header">
                    <span class="section-title">Daily Goals</span>
                    <button class="edit-btn" id="edit-btn" onclick="toggleEdit()">Edit</button>
                </div>

                <div class="goal-row">
                    <div class="goal-icon cal">🔥</div>
                    <div class="goal-label">Calories<span class="goal-unit">kcal</span></div>
                    <span class="goal-value cal" id="val-cal">2000</span>
                    <input class="goal-input" type="number" id="inp-cal" min="500" max="10000">
                </div>

                <div class="goal-row">
                    <div class="goal-icon pro">🥩</div>
                    <div class="goal-label">Protein<span class="goal-unit">g</span></div>
                    <span class="goal-value pro" id="val-pro">150</span>
                    <input class="goal-input" type="number" id="inp-pro" min="10" max="500">
                </div>

                <div class="goal-row">
                    <div class="goal-icon carb">🌾</div>
                    <div class="goal-label">Carbs<span class="goal-unit">g</span></div>
                    <span class="goal-value carb" id="val-carb">200</span>
                    <input class="goal-input" type="number" id="inp-carb" min="10" max="1000">
                </div>

                <div class="goal-row">
                    <div class="goal-icon fat">🥑</div>
                    <div class="goal-label">Fat<span class="goal-unit">g</span></div>
                    <span class="goal-value fat" id="val-fat">65</span>
                    <input class="goal-input" type="number" id="inp-fat" min="10" max="500">
                </div>
            </div>

            <!-- logout -->
            <div class="section-card">
                <button class="logout-btn" onclick="logout()">
                    <i class="fas fa-right-from-bracket"></i> Log Out
                </button>
            </div>

        </div>

        <!-- saved toast notification -->
        <div class="toast" id="toast">Goals saved!</div>

        <div class="bottom-nav">
            <button class="nav-item" onclick="navigate('/')"><i class="fas fa-house"></i><span>Home</span></button>
            <button class="nav-item" onclick="navigate('/add-food')"><i class="fas fa-plus"></i><span>Add</span></button>
            <button class="nav-item" onclick="navigate('/stats')"><i class="fas fa-calendar-days"></i><span>Diary</span></button>
            <button class="nav-item" onclick="navigate('/community')"><i class="fas fa-robot"></i><span>NutriBot</span></button>
            <button class="nav-item active" onclick="navigate('/profile')"><i class="fas fa-user"></i><span>Profile</span></button>
        </div>
    </div>

    <script>
        function navigate(path) { window.location.href = path; }
        function logout()       { window.location.href = '/logout'; }

        let editing = false;

        // load the users info and goals from Flask
        async function loadUser() {
            const res  = await fetch('/api/user');
            const user = await res.json();

            // avatar shows the first letter of the username
            document.getElementById('avatar').textContent    = user.username.charAt(0).toUpperCase();
            document.getElementById('user-name').textContent = user.username;
            document.getElementById('user-email').textContent = user.email;

            if (user.is_student) {
                document.getElementById('student-badge').style.display = 'block';
            }

            // fill in goal values
            setGoals(
                user.daily_calorie_goal,
                user.daily_protein_goal,
                user.daily_carbs_goal,
                user.daily_fat_goal
            );
        }

        function setGoals(cal, pro, carb, fat) {
            document.getElementById('val-cal').textContent  = cal;
            document.getElementById('val-pro').textContent  = pro;
            document.getElementById('val-carb').textContent = carb;
            document.getElementById('val-fat').textContent  = fat;

            document.getElementById('inp-cal').value  = cal;
            document.getElementById('inp-pro').value  = pro;
            document.getElementById('inp-carb').value = carb;
            document.getElementById('inp-fat').value  = fat;
        }

        // switches between view mode and edit mode
        function toggleEdit() {
            editing = !editing;
            const btn = document.getElementById('edit-btn');

            const values = ['cal', 'pro', 'carb', 'fat'];
            const inputs = ['inp-cal', 'inp-pro', 'inp-carb', 'inp-fat'];

            if (editing) {
                // show inputs, hide values
                btn.textContent = 'Save';
                btn.classList.add('saving');
                values.forEach(id => document.getElementById(`val-${id}`).style.display = 'none');
                inputs.forEach(id => document.getElementById(id).style.display = 'block');
            } else {
                // save and switch back to view mode
                saveGoals();
            }
        }

        async function saveGoals() {
            const cal  = parseInt(document.getElementById('inp-cal').value)  || 2000;
            const pro  = parseInt(document.getElementById('inp-pro').value)  || 150;
            const carb = parseInt(document.getElementById('inp-carb').value) || 200;
            const fat  = parseInt(document.getElementById('inp-fat').value)  || 65;

            const res  = await fetch('/api/update-goals', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ calories: cal, protein: pro, carbs: carb, fat: fat })
            });
            const data = await res.json();

            if (data.success) {
                // update the displayed values and switch back to view mode
                setGoals(cal, pro, carb, fat);

                const btn = document.getElementById('edit-btn');
                btn.textContent = 'Edit';
                btn.classList.remove('saving');

                ['cal','pro','carb','fat'].forEach(id => {
                    document.getElementById(`val-${id}`).style.display = '';
                    document.getElementById(`inp-${id}`).style.display = 'none';
                });

                // show the saved toast for 2 seconds
                const toast = document.getElementById('toast');
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2000);
            }
        }

        loadUser();
    </script>
</body>
</html>
