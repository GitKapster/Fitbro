<!DOCTYPE html>
<html>
<head>
    <title>FitBro - NutriBot</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .phone-frame {
            width: 400px;
            background: white;
            border-radius: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            height: 750px;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: linear-gradient(135deg, #48c774, #3ab566);
            padding: 30px 25px;
            color: white;
            flex-shrink: 0;
        }

        .header-top { display: flex; align-items: center; gap: 12px; }

        .bot-avatar {
            width: 48px;
            height: 48px;
            background: rgba(255,255,255,0.25);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .header h1 { font-size: 24px; font-weight: 700; margin-bottom: 2px; }
        .header p  { font-size: 13px; opacity: 0.9; }

        .content {
            flex: 1;
            overflow-y: auto;
            background: #f5f5f5;
            padding: 15px;
        }

        .snapshot-card {
            background: white;
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .snapshot-title    { font-size: 13px; font-weight: 700; color: #95a5a6; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
        .snapshot-subtitle { font-size: 11px; color: #bdc3c7; margin-bottom: 12px; }

        .macro-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }

        .macro-pill { background: #f8f9fa; border-radius: 12px; padding: 10px 6px; text-align: center; }
        .macro-pill .val { font-size: 16px; font-weight: 700; }
        .macro-pill .lbl { font-size: 10px; color: #95a5a6; text-transform: uppercase; letter-spacing: 0.03em; margin-top: 2px; }

        .macro-pill.cal  .val { color: #e67e22; }
        .macro-pill.pro  .val { color: #3498db; }
        .macro-pill.carb .val { color: #9b59b6; }
        .macro-pill.fat  .val { color: #f39c12; }

        /* alert cards are now clickable */
        .alert-card {
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .alert-card:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,0.1); }

        .alert-card.warning { background: #fff8f0; border-left: 4px solid #f39c12; }
        .alert-card.danger  { background: #fff5f5; border-left: 4px solid #e74c3c; }
        .alert-card.good    { background: #f0f9f4; border-left: 4px solid #48c774; cursor: default; }
        .alert-card.good:hover { transform: none; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }

        .alert-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .alert-icon   { font-size: 22px; }
        .alert-title  { font-size: 15px; font-weight: 700; color: #2c3e50; flex: 1; }
        .alert-body   { font-size: 13px; color: #5d6d7e; line-height: 1.6; margin-bottom: 10px; }
        .alert-stat   { font-weight: 700; color: #2c3e50; }

        /* tap to learn more hint shown on warning/danger cards */
        .learn-more {
            font-size: 12px;
            font-weight: 600;
            color: #e67e22;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .alert-card.danger .learn-more { color: #e74c3c; }

        .trend-row { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }

        .trend-day {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f8f9fa;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 13px;
        }

        .trend-day .date-label { color: #7f8c8d; font-weight: 500; }
        .trend-day .trend-val  { color: #2c3e50; font-weight: 700; }

        .state-card { background: white; border-radius: 20px; padding: 40px 20px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .state-card .icon { font-size: 40px; margin-bottom: 12px; }
        .state-card p     { font-size: 14px; color: #7f8c8d; line-height: 1.6; }

        .bottom-nav {
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            background: linear-gradient(135deg, #2d6a4f, #1b4332);
            flex-shrink: 0;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            background: none;
            border: none;
            color: rgba(255,255,255,0.4);
            font-size: 10px;
            cursor: pointer;
            padding: 4px 10px;
            transition: color 0.2s;
        }

        .nav-item i { font-size: 18px; }
        .nav-item.active { color: white; }
    </style>
</head>
<body>
    <div class="phone-frame">

        <div class="header">
            <div class="header-top">
                <div class="bot-avatar">🤖</div>
                <div>
                    <h1>NutriBot</h1>
                    <p>Your personal nutrition advisor</p>
                </div>
            </div>
        </div>

        <div class="content" id="content">
            <div class="state-card">
                <div class="icon">🔄</div>
                <p>Loading your nutrition data...</p>
            </div>
        </div>

        <div class="bottom-nav">
            <button class="nav-item" onclick="navigate('/')"><i class="fas fa-house"></i><span>Home</span></button>
            <button class="nav-item" onclick="navigate('/add-food')"><i class="fas fa-plus"></i><span>Add</span></button>
            <button class="nav-item" onclick="navigate('/stats')"><i class="fas fa-calendar-days"></i><span>Diary</span></button>
            <button class="nav-item active" onclick="navigate('/community')"><i class="fas fa-robot"></i><span>NutriBot</span></button>
            <button class="nav-item" onclick="navigate('/profile')"><i class="fas fa-user"></i><span>Profile</span></button>
        </div>
    </div>

    <script>
        function navigate(path) { window.location.href = path; }

        const LIMITS = {
            protein_week:  1400,
            fat_week:       700,
            carbs_week:    2800,
            calories_week: 21000
        };

        async function loadData() {
            try {
                const res  = await fetch('/api/nutrition-summary');
                const days = await res.json();
                render(days);
            } catch (e) {
                document.getElementById('content').innerHTML = `
                    <div class="state-card">
                        <div class="icon">⚠️</div>
                        <p>Could not load nutrition data. Make sure Flask is running.</p>
                    </div>`;
            }
        }

        function render(days) {
            const content = document.getElementById('content');

            if (!days.length) {
                content.innerHTML = `
                    <div class="state-card">
                        <div class="icon">🍽️</div>
                        <p>No food logged yet. Start tracking your meals and NutriBot will analyse your nutrition for you.</p>
                    </div>`;
                return;
            }

            const week = days.reduce((acc, d) => {
                acc.calories += d.total_calories;
                acc.protein  += d.total_protein;
                acc.carbs    += d.total_carbs;
                acc.fat      += d.total_fat;
                return acc;
            }, { calories: 0, protein: 0, carbs: 0, fat: 0 });

            week.calories = Math.round(week.calories);
            week.protein  = Math.round(week.protein);
            week.carbs    = Math.round(week.carbs);
            week.fat      = Math.round(week.fat);

            const daysLogged = days.length;
            const alerts = [];

            if (week.protein > LIMITS.protein_week) {
                alerts.push({
                    type: 'danger', icon: '🧬', infoType: 'protein',
                    title: 'Very High Protein This Week',
                    body: `Your total protein this week is <span class="alert-stat">${week.protein}g</span> across ${daysLogged} logged days, 
                           averaging <span class="alert-stat">${Math.round(week.protein / daysLogged)}g per day</span>. 
                           Consistently eating above 200g per day can put strain on your kidneys and liver.`
                });
            } else if (week.protein > LIMITS.protein_week * 0.75) {
                alerts.push({
                    type: 'warning', icon: '🧬', infoType: 'protein',
                    title: 'Elevated Protein This Week',
                    body: `Your weekly protein total is <span class="alert-stat">${week.protein}g</span>, averaging 
                           <span class="alert-stat">${Math.round(week.protein / daysLogged)}g per day</span>. 
                           This is approaching high levels. For most adults 100–160g per day is a healthy range.`
                });
            }

            if (week.fat > LIMITS.fat_week) {
                alerts.push({
                    type: 'danger', icon: '🫀', infoType: 'fat',
                    title: 'High Fat Intake This Week',
                    body: `Your total fat this week is <span class="alert-stat">${week.fat}g</span>, averaging 
                           <span class="alert-stat">${Math.round(week.fat / daysLogged)}g per day</span>. 
                           A consistently high fat diet is linked to raised cholesterol and cardiovascular disease.`
                });
            } else if (week.fat > LIMITS.fat_week * 0.75) {
                alerts.push({
                    type: 'warning', icon: '🫀', infoType: 'fat',
                    title: 'Elevated Fat This Week',
                    body: `Your weekly fat total is <span class="alert-stat">${week.fat}g</span>. 
                           This is above the ideal range. Consider swapping some high fat foods for leaner options.`
                });
            }

            if (week.carbs > LIMITS.carbs_week) {
                alerts.push({
                    type: 'warning', icon: '🩸', infoType: 'carbs',
                    title: 'High Carbohydrate Intake This Week',
                    body: `Your total carbs this week is <span class="alert-stat">${week.carbs}g</span>, averaging 
                           <span class="alert-stat">${Math.round(week.carbs / daysLogged)}g per day</span>. 
                           Very high carb intake can cause blood sugar spikes and may contribute to insulin resistance.`
                });
            }

            if (week.calories > LIMITS.calories_week) {
                alerts.push({
                    type: 'warning', icon: '⚡', infoType: 'calories',
                    title: 'Significant Calorie Surplus This Week',
                    body: `Your total calories this week are <span class="alert-stat">${week.calories} kcal</span>, averaging 
                           <span class="alert-stat">${Math.round(week.calories / daysLogged)} kcal per day</span>. 
                           A consistent large surplus will lead to weight gain over time.`
                });
            }

            if (!alerts.length) {
                alerts.push({
                    type: 'good', icon: '✅', infoType: null,
                    title: 'Great Week So Far',
                    body: `Your nutrition this week looks healthy and well within safe limits. Keep logging your meals so NutriBot can keep an eye on things for you.`
                });
            }

            let html = '';

            html += `
                <div class="snapshot-card">
                    <div class="snapshot-title">This Week's Summary</div>
                    <div class="snapshot-subtitle">${daysLogged} day${daysLogged !== 1 ? 's' : ''} logged this week</div>
                    <div class="macro-row">
                        <div class="macro-pill cal"><div class="val">${week.calories}</div><div class="lbl">kcal</div></div>
                        <div class="macro-pill pro"><div class="val">${week.protein}g</div><div class="lbl">Protein</div></div>
                        <div class="macro-pill carb"><div class="val">${week.carbs}g</div><div class="lbl">Carbs</div></div>
                        <div class="macro-pill fat"><div class="val">${week.fat}g</div><div class="lbl">Fat</div></div>
                    </div>
                </div>`;

            alerts.forEach(a => {
                // only warning and danger cards are clickable and show the learn more hint
                const clickable = a.infoType ? `onclick="navigate('/nutribot-info?type=${a.infoType}')"` : '';
                const learnMore = a.infoType
                    ? `<div class="learn-more"><i class="fas fa-circle-info"></i> Tap to learn more</div>`
                    : '';

                html += `
                    <div class="alert-card ${a.type}" ${clickable}>
                        <div class="alert-header">
                            <span class="alert-icon">${a.icon}</span>
                            <span class="alert-title">${a.title}</span>
                        </div>
                        <div class="alert-body">${a.body}</div>
                        ${learnMore}
                    </div>`;
            });

            if (days.length > 1) {
                const dayNames = ['Today','Yesterday','2 days ago','3 days ago','4 days ago','5 days ago','6 days ago'];
                html += `
                    <div class="snapshot-card">
                        <div class="snapshot-title">Daily Breakdown</div>
                        <div class="snapshot-subtitle">Calories per logged day</div>
                        <div class="trend-row">
                            ${days.map((d, i) => `
                                <div class="trend-day">
                                    <span class="date-label">${dayNames[i] || d.date}</span>
                                    <span class="trend-val">${d.total_calories} kcal</span>
                                </div>`).join('')}
                        </div>
                    </div>`;
            }

            content.innerHTML = html;
        }

        loadData();
    </script>
</body>
</html>
